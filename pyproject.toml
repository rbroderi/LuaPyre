[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "luapyre"
version = "0.2.0a1"
description = "A high-performance, sandboxed Lua 5.5 runtime for Python with optional gradual typing"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Rick Broderick"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-benchmark>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/luapyre"]
