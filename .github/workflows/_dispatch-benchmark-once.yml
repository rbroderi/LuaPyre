name: one-shot dispatch benchmark

on:
  push:
    branches:
      - v0.12-dispatch-cleanup

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: v0.12-dispatch-cleanup
          path: candidate
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -e baseline[dev]
      - name: Benchmark baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          echo '=== pass 1: baseline then candidate ==='
          PYTHONPATH="$PWD/baseline/src" python baseline/benchmarks/vm_programs.py
          PYTHONPATH="$PWD/candidate/src" python candidate/benchmarks/vm_programs.py
          echo '=== pass 2: candidate then baseline ==='
          PYTHONPATH="$PWD/candidate/src" python candidate/benchmarks/vm_programs.py
          PYTHONPATH="$PWD/baseline/src" python baseline/benchmarks/vm_programs.py
          echo '=== pass 3: baseline then candidate ==='
          PYTHONPATH="$PWD/baseline/src" python baseline/benchmarks/vm_programs.py
          PYTHONPATH="$PWD/candidate/src" python candidate/benchmarks/vm_programs.py
      - name: Remove benchmark workflow from branch
        working-directory: candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_dispatch-benchmark-once.yml
          git commit -m "Remove temporary dispatch benchmark workflow"
          git push origin HEAD:v0.12-dispatch-cleanup
