name: 0.17 value IR same-runner A/B

on:
  push:
    branches:
      - v0.17-value-ir

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare merged 0.16 with value IR branch
        shell: bash
        run: |
          echo 'baseline (merged 0.16)'
          PYTHONPATH="$GITHUB_WORKSPACE/_baseline/src" python benchmarks/value_ir_ab.py --label main
          echo 'value IR branch'
          PYTHONPATH="$GITHUB_WORKSPACE/src" python benchmarks/value_ir_ab.py --label value-ir
