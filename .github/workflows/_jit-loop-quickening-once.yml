name: one-shot JIT loop quickening

on:
  push:
    branches: [v0.13-tiered-jit]
    paths:
      - '.github/workflows/_jit-loop-quickening-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.13-tiered-jit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply JFORLOOP quickening
        run: |
          python - <<'PY'
          from pathlib import Path

          # Internal quickened opcode. Append it so existing serialized opcode
          # numbers remain stable across the 0.12 -> 0.13 transition.
          p = Path('src/luapyre/bytecode.py')
          s = p.read_text()
          old = '    PVARARG = auto(); PGETVARG = auto()\n'
          new = '    PVARARG = auto(); PGETVARG = auto()\n\n    # Source-compiler quickening marker for a numeric loop whose body is\n    # structurally eligible for the tier-2 JIT. Interpreter semantics are\n    # identical to FORLOOP; only TieredJITVM gives it a hotness hook.\n    JFORLOOP = auto()\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          Path('src/luapyre/jit_policy.py').write_text('''from __future__ import annotations\n\nfrom .bytecode import Op\n\n\n# Keep structural eligibility independent of the Python backend.  This is the\n# Tier-1 quickening policy; a later native backend can consume the same marker.\nJIT_LOOP_BODY_OPS = frozenset({\n    Op.LOADK,\n    Op.MOVE,\n    Op.LOCAL,\n    Op.NEWTABLE,\n    Op.GETTABLE,\n    Op.SETTABLE,\n    Op.ADD,\n    Op.ADD_I,\n    Op.ADD_F,\n    Op.SUB,\n    Op.SUB_I,\n    Op.SUB_F,\n    Op.MUL,\n    Op.MUL_I,\n    Op.MUL_F,\n    Op.MOD,\n    Op.EQ,\n    Op.LT,\n    Op.LE,\n    Op.NOT,\n    Op.TOBOOL,\n})\n\n\ndef can_jit_natural_loop(code, start_pc: int, end_pc: int) -> bool:\n    return start_pc < end_pc and all(\n        ins.op in JIT_LOOP_BODY_OPS for ins in code[start_pc:end_pc]\n    )\n''')

          # Source compiler selects the quickened opcode once, at compile time.
          p = Path('src/luapyre/compiler.py')
          s = p.read_text()
          old = 'from .errors import LuaSyntaxError, LuaTypeError\nfrom .semantics import analyze_control_flow\n'
          new = 'from .errors import LuaSyntaxError, LuaTypeError\nfrom .jit_policy import can_jit_natural_loop\nfrom .semantics import analyze_control_flow\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '            self.emit_close_to(base, update=True)\n            self.emit(Op.FORLOOP, idx, limit, step, body_start)\n            end = len(self.proto.code)\n'
          new = '            self.emit_close_to(base, update=True)\n            loop_op = (\n                Op.JFORLOOP\n                if can_jit_natural_loop(self.proto.code, body_start, len(self.proto.code))\n                else Op.FORLOOP\n            )\n            self.emit(loop_op, idx, limit, step, body_start)\n            end = len(self.proto.code)\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # JIT backend shares the compiler's structural policy and accepts the
          # quickened opcode as the natural-loop terminator.
          p = Path('src/luapyre/jit.py')
          s = p.read_text()
          old = 'from .bytecode import Cell, Ins, Op, Proto\nfrom .table import LuaTable\n'
          new = 'from .bytecode import Cell, Ins, Op, Proto\nfrom .jit_policy import JIT_LOOP_BODY_OPS\nfrom .table import LuaTable\n'
          assert old in s
          s = s.replace(old, new, 1)
          start = s.index('_LOOP_BODY_OPS = frozenset({')
          end = s.index('\n\n_LEAF_OPS', start)
          s = s[:start] + '_LOOP_BODY_OPS = JIT_LOOP_BODY_OPS' + s[end:]
          s = s.replace('if ins.op is Op.FORLOOP and 0 <= ins.d < pc:', 'if ins.op in (Op.FORLOOP, Op.JFORLOOP) and 0 <= ins.d < pc:')
          s = s.replace('if loop_ins.op is not Op.FORLOOP or loop_ins.d != start_pc:', 'if loop_ins.op not in (Op.FORLOOP, Op.JFORLOOP) or loop_ins.d != start_pc:')
          # Remove the intentionally ugly placeholder from the first prototype.
          s = s.replace('            "_forloop": frame.__class__.proto.fget.__self__ if False else None,\n', '            "_forloop": None,\n')
          p.write_text(s)

          # Base interpreter maps JFORLOOP to exact FORLOOP semantics.
          p = Path('src/luapyre/opdispatch.py')
          s = p.read_text()
          old = '    Op.FORPREP: _forprep,\n    Op.FORLOOP: _forloop,\n'
          new = '    Op.FORPREP: _forprep,\n    Op.FORLOOP: _forloop,\n    Op.JFORLOOP: _forloop,\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # GC analysis treats the quickened opcode exactly like FORLOOP.
          p = Path('src/luapyre/gc.py')
          s = p.read_text()
          old = '    Op.FORPREP: _rw_forprep,\n    Op.FORLOOP: _rw_forloop,\n'
          new = '    Op.FORPREP: _rw_forprep,\n    Op.FORLOOP: _rw_forloop,\n    Op.JFORLOOP: _rw_forloop,\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'for _op in (Op.FORPREP, Op.FORLOOP, Op.PFORPREP, Op.PFORLOOP, Op.PTFORLOOP):\n'
          new = 'for _op in (Op.FORPREP, Op.FORLOOP, Op.JFORLOOP, Op.PFORPREP, Op.PFORLOOP, Op.PTFORLOOP):\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Only quickened loops enter the JIT-aware handler. Normal FORLOOP
          # remains byte-for-byte on the original dispatch path.
          p = Path('src/luapyre/jitvm.py')
          s = p.read_text()
          s = s.replace('def _jit_forloop(vm, frames, frame, ins, regs, constants):', 'def _jit_forloop(vm, frames, frame, ins, regs, constants):')
          old = '_JIT_OPCODE_HANDLERS = dict(OPCODE_HANDLERS)\n_JIT_OPCODE_HANDLERS[Op.FORLOOP] = _jit_forloop\n'
          new = '_JIT_OPCODE_HANDLERS = dict(OPCODE_HANDLERS)\n_JIT_OPCODE_HANDLERS[Op.JFORLOOP] = _jit_forloop\n'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Regression coverage: eligible loops quicken; branchy loops do not.
          p = Path('tests/test_jit.py')
          s = p.read_text()
          addition = '''\n\ndef test_only_structurally_eligible_loops_are_quickened():\n    runtime = LuaRuntime(jit=False)\n    eligible = runtime.compile(\n        "local s = 0; for i = 1, 20 do s = s + i end; return s"\n    )\n    assert any(ins.op is Op.JFORLOOP for ins in eligible.code)\n    assert runtime.vm.run(eligible) == 210\n\n    branchy = runtime.compile(\n        "local s = 0; for i = 1, 20 do "\n        "if i % 2 == 0 then s = s + i else s = s - 1 end "\n        "end; return s"\n    )\n    assert any(ins.op is Op.FORLOOP for ins in branchy.code)\n    assert not any(ins.op is Op.JFORLOOP for ins in branchy.code)\n    assert runtime.vm.run(branchy) == 100\n'''
          assert 'test_only_structurally_eligible_loops_are_quickened' not in s
          p.write_text(s + addition)
          PY
      - name: Test quickened implementation
        run: python -m pip install -e '.[dev]' && pytest -q
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/_jit-loop-quickening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Quickening JIT-eligible numeric loops'
          git push origin HEAD:v0.13-tiered-jit
