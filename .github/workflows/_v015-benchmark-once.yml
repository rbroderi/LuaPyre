name: 0.15 benchmark validation

on:
  push:
    branches:
      - v0.15-ast-superjit

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install LuaPyre and benchmark dependencies
        run: python -m pip install -e '.[dev]'
      - name: Diagnose typed-call tier selection
        run: |
          python - <<'PY'
          from benchmarks.vm_programs import WORKLOADS
          from luapyre import LuaRuntime

          workload = WORKLOADS["typed_calls"]
          runtime = LuaRuntime(jit_threshold=1, fuel=2_000_000)
          proto = runtime.compile(workload.source_for("luapyre"))
          print("TOP PROTO")
          print(proto.disassemble())
          for i, child in enumerate(proto.children):
              print(f"CHILD {i}: {child.name}")
              print("upvalues:", child.upvalues)
              print(child.disassemble())
          print("result:", runtime.vm.run(proto, fuel=2_000_000))
          print("stats:", runtime.jit_stats)
          for key, state in runtime.vm._jit_loop_states.items():
              runner = getattr(state, "runner", None)
              if runner is not None:
                  print("loop state", key, runner.__code__.co_filename, runner.__code__.co_name)
          PY
      - name: Run four-way validation benchmark
        run: |
          python benchmarks/compare_runtimes.py \
            --repeats 1 \
            --warmups 1 \
            --require-all \
            --json benchmark-results.json \
            | tee benchmark-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v015-validation-${{ github.run_id }}
          path: |
            benchmark-results.txt
            benchmark-results.json
          if-no-files-found: warn
