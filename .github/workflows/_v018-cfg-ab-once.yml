name: 0.18 CFG value IR same-runner A/B

on:
  push:
    branches:
      - v0.18-cfg-value-ir

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _baseline
      - uses: actions/checkout@v4
        with:
          ref: 56b2169381f10c60daac5a1462a89bb087c4bff5
          path: _generic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare merged 0.17, generic CFG and structured CFG
        shell: bash
        run: |
          echo 'baseline (merged 0.17)'
          PYTHONPATH="$GITHUB_WORKSPACE/_baseline/src" python benchmarks/value_ir_ab.py --label main --warmups 3 --repeats 9
          echo 'generic CFG value IR'
          PYTHONPATH="$GITHUB_WORKSPACE/_generic/src" python benchmarks/value_ir_ab.py --label generic --warmups 3 --repeats 9
          echo 'structured CFG value IR'
          PYTHONPATH="$GITHUB_WORKSPACE/src" python benchmarks/value_ir_ab.py --label structured --warmups 3 --repeats 9
