name: 0.19 dominance and cyclic CFG same-runner A/B

on:
  push:
    branches:
      - v0.19-dominance-cyclic-cfg

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compare merged 0.18 with 0.19 CFG Value IR
        shell: bash
        run: |
          echo 'baseline (merged 0.18)'
          PYTHONPATH="$GITHUB_WORKSPACE/_baseline/src" python benchmarks/value_ir_ab.py --label main --warmups 3 --repeats 9
          echo '0.19 dominance/cyclic CFG'
          PYTHONPATH="$GITHUB_WORKSPACE/src" python benchmarks/value_ir_ab.py --label cfg019 --warmups 3 --repeats 9
