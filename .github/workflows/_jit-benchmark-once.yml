name: one-shot 0.13 runtime benchmark

on:
  push:
    branches: [v0.13-tiered-jit]
    paths:
      - '.github/workflows/_jit-benchmark-once.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install LuaPyre and benchmark dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compare runtimes with JFORLOOP quickening
        run: python benchmarks/compare_runtimes.py --repeats 7 --warmups 3 --require-all
