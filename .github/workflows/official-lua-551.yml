name: official Lua 5.5.1 conformance

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Optional space-separated suite-relative .lua files to execute"
        required: false
        default: ""
        type: string
      full_mode:
        description: "Run selected files without _U=true"
        required: false
        default: false
        type: boolean

jobs:
  official-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install LuaPyre
        run: python -m pip install -e .[dev]
      - name: Verify and inventory exact Lua 5.5.1 suite
        run: python tools/official_551.py --work-dir .official-lua-551 --list
      - name: Run explicitly selected upstream files
        if: ${{ inputs.files != '' }}
        env:
          OFFICIAL_FILES: ${{ inputs.files }}
          FULL_MODE: ${{ inputs.full_mode }}
        run: |
          python - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          files = shlex.split(os.environ["OFFICIAL_FILES"])
          cmd = [
              sys.executable,
              "tools/official_551.py",
              "--work-dir",
              ".official-lua-551",
              "--no-download",
              "--files",
              *files,
          ]
          if os.environ.get("FULL_MODE", "false").lower() == "true":
              cmd.append("--full-mode")
          raise SystemExit(subprocess.call(cmd))
          PY
