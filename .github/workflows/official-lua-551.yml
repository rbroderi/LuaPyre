name: official Lua 5.5.1 conformance

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Optional space-separated suite-relative .lua files to execute"
        required: false
        default: ""
        type: string
      full_mode:
        description: "Run selected files without _U=true"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - v0.11-official-suite-baseline
      - v0.12-official-suite-expansion

jobs:
  official-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install LuaPyre
        run: python -m pip install -e .[dev]
      - name: Verify, classify, and run exact Lua 5.5.1 baseline
        run: |
          python tools/official_551.py \
            --work-dir .official-lua-551 \
            --classify \
            --baseline \
            --report-json .official-lua-551/report.json
      - name: Probe 0.12 compatibility targets
        if: ${{ github.ref_name == 'v0.12-official-suite-expansion' }}
        run: |
          python tools/official_551.py \
            --work-dir .official-lua-551 \
            --no-download \
            --echo \
            --files pm.lua tpack.lua vararg.lua bitwise.lua math.lua utf8.lua
      - name: Run explicitly selected upstream files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.files != '' }}
        env:
          OFFICIAL_FILES: ${{ inputs.files }}
          FULL_MODE: ${{ inputs.full_mode }}
        run: |
          python - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          files = shlex.split(os.environ["OFFICIAL_FILES"])
          cmd = [
              sys.executable,
              "tools/official_551.py",
              "--work-dir",
              ".official-lua-551",
              "--no-download",
              "--files",
              *files,
          ]
          if os.environ.get("FULL_MODE", "false").lower() == "true":
              cmd.append("--full-mode")
          raise SystemExit(subprocess.call(cmd))
          PY
      - name: Upload conformance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-lua-551-report
          path: .official-lua-551/report.json
          if-no-files-found: ignore
