name: upstream package compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run pinned upstream package tests and workloads
        run: python tools/upstream_compat.py
