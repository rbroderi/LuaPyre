name: apply 0.12 semantic patch

on:
  push:
    branches:
      - v0.12-official-suite-expansion

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply semantic patch
        run: python tools/_v012_apply.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/luapyre
          git commit -m "Fix Lua 5.5 coercion vararg pattern pack and UTF-8 semantics"
          git push
