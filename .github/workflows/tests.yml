name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build official Lua 5.5.1 reference interpreter
        run: |
          curl -fsSLO https://www.lua.org/ftp/lua-5.5.1.tar.gz
          echo "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce  lua-5.5.1.tar.gz" | sha256sum -c -
          tar -xzf lua-5.5.1.tar.gz
          make -C lua-5.5.1 -j2
          echo "LUA55_BIN=$PWD/lua-5.5.1/src/lua" >> "$GITHUB_ENV"
      - run: python -m pip install -e .[dev]
      - run: pytest
